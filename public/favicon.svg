<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0EA5E9" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="none" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Mecca M Monogram -->
  <g filter="url(#glow)">
    <!-- Left Pillar -->
    <path d="M 52 194 L 52 68 L 60 62 L 84 62 L 84 194 Z" fill="url(#pillarGrad)"/>
    <!-- Right Pillar -->
    <path d="M 172 194 L 172 62 L 196 62 L 204 68 L 204 194 Z" fill="url(#pillarGrad)"/>
    <!-- Dynamic Chevron Left Facet -->
    <polygon points="84,62 128,136 128,182 84,112" fill="url(#facetLeft)"/>
    <!-- Dynamic Chevron Right Facet -->
    <polygon points="128,136 172,62 172,112 128,182" fill="url(#facetRight)"/>
  </g>
</svg>